<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yellow Bloom | Flores Amarillas</title>
    <meta
      name="description"
      content="Un campo de flores amarillas con animación suave, brillo y un fondo nocturno elegante."
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd74a'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff4a3'/%3E%3Cg fill='%23ffbf1f' stroke='%23fff4c2' stroke-width='2'%3E%3Cellipse cx='32' cy='14' rx='6' ry='12'/%3E%3Cellipse cx='32' cy='50' rx='6' ry='12'/%3E%3Cellipse cx='14' cy='32' rx='12' ry='6'/%3E%3Cellipse cx='50' cy='32' rx='12' ry='6'/%3E%3Cellipse cx='20' cy='20' rx='9' ry='5' transform='rotate(-45 20 20)'/%3E%3Cellipse cx='44' cy='20' rx='9' ry='5' transform='rotate(45 44 20)'/%3E%3Cellipse cx='20' cy='44' rx='9' ry='5' transform='rotate(45 20 44)'/%3E%3Cellipse cx='44' cy='44' rx='9' ry='5' transform='rotate(-45 44 44)'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="brand" aria-label="Yellow Bloom logo">
      <div class="brand-mark" aria-hidden="true">
        <span class="petal petal-1"></span>
        <span class="petal petal-2"></span>
        <span class="petal petal-3"></span>
        <span class="petal petal-4"></span>
        <span class="center-dot"></span>
      </div>
      <span class="brand-text">Yellow Bloom</span>
    </div>

    <canvas id="fieldCanvas" aria-hidden="true"></canvas>

    <div class="overlay">
      <div class="halo" aria-hidden="true"></div>
      <h1>Si nadie te dio flores amarillas aqui hay</h1>
    </div>

    <main class="story-section" aria-label="Mensaje final">
      <button class="story-button" id="openModalBtn" type="button">presiona</button>
    </main>

    <div class="modal hidden" id="messageModal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="close-button" type="button" aria-label="Cerrar">×</button>
        <h2 id="modalTitle">Mensaje</h2>
        <p class="modal-message">
          No te olvides de respirar y ser amable contigo mismo. Estás haciendo un gran trabajo.
        </p>
        <img src="gato-like.png" alt="Gato estilo ilustración" class="modal-image" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
